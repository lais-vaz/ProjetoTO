<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes do Produto</title>
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="src/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-success navbar-dark border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"
          >Sentidos Terapêuticos</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="index.html">Home</a>
            <a class="nav-link" href="index.html#produtos">Produtos</a>
            <a class="nav-link" href="index.html#contato">Contato</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <div class="row g-5">
        <div class="col-md-6">
          <div class="text-center p-4 bg-light rounded-3 mb-3">
            <img
              id="prod-img"
              src=""
              class="img-fluid main-product-img"
              alt="Produto"
            />
          </div>
        </div>

        <div class="col-md-6">
          <h1 id="prod-title" class="fw-bold fs-2 mb-3">Carregando...</h1>
          <h2 id="prod-price" class="fw-bold text-dark mb-4">R$ 0,00</h2>

          <div class="mb-4">
            <label class="form-label small text-muted">Quantidade:</label>
            <div class="input-group" style="width: 130px">
              <button
                class="btn btn-outline-secondary"
                type="button"
                onclick="alterarQtd(-1)"
              >
                -
              </button>
              <input
                type="text"
                id="qtdInput"
                class="form-control text-center"
                value="1"
                readonly
              />
              <button
                class="btn btn-outline-secondary"
                type="button"
                onclick="alterarQtd(1)"
              >
                +
              </button>
            </div>
          </div>

          <p id="prod-desc" class="text-muted small mb-4"></p>

          <button
            class="btn btn-success btn-lg w-100 fw-bold text-uppercase mb-2"
          >
            Adicionar ao Carrinho
          </button>
          <button class="btn btn-primary btn-lg w-100 fw-bold">
            Finalizar Compra
          </button>

          <div class="accordion mt-4" id="accordionDetalhes">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button collapsed fw-bold"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseOne"
                >
                  Reviews (1)
                </button>
              </h2>
              <div
                id="collapseOne"
                class="accordion-collapse collapse"
                data-bs-parent="#accordionDetalhes"
              >
                <div class="accordion-body small text-muted">
                  "Excelente material! Muito resistente e ajuda muito no
                  atendimento das crianças." - Dra. Camila
                </div>
              </div>
            </div>
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button collapsed fw-bold"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseTwo"
                >
                  Especificações Técnicas
                </button>
              </h2>
              <div
                id="collapseTwo"
                class="accordion-collapse collapse"
                data-bs-parent="#accordionDetalhes"
              >
                <div class="accordion-body small text-muted">
                  Material atóxico, lavável e atende às normas de segurança para
                  uso terapêutico.
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/script.js"></script>
  </body>
</html>
